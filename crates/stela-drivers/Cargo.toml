[package]
name = "stela-drivers"
version.workspace = true
edition.workspace = true
# Stela's own code is GPL-2.0-or-later; Linux-derived USB, Bluetooth and input
# code retains its GPL/ISC notices, the Intel shared initialization also
# retains BSD terms, and the Asahi and NXP Bluetooth sources their MIT notices.
license = "GPL-2.0-or-later AND GPL-2.0-only AND MIT AND BSD-3-Clause AND ISC"
description = "Stela's PC drivers by device class, with USB, Bluetooth and input"
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
native-acpi = ["stela-driver-base/native-acpi", "stela-driver-net/native-acpi"]
ram-disk = ["stela-driver-base/ram-disk"]
irq-diagnostics = ["stela-driver-base/irq-diagnostics"]
nouveau-port = ["stela-driver-gpu/nouveau-port"]
amdgpu-port = ["stela-driver-gpu/amdgpu-port"]
metal = ["stela-driver-gpu/metal"]
metal-vulkan = ["stela-driver-gpu/metal-vulkan"]
metal-linked = ["stela-driver-gpu/metal-linked"]

[dependencies]
stela-driver-audio = { path = "../stela-driver-audio" }
stela-driver-base = { path = "../stela-driver-base" }
stela-driver-core = { path = "../stela-driver-core" }
stela-driver-gpu = { path = "../stela-driver-gpu" }
stela-driver-net = { path = "../stela-driver-net" }
stela-driver-storage = { path = "../stela-driver-storage" }
# SHA-1 and SHA-256 over Bluetooth firmware images.
stela-crypto = { path = "../stela-crypto" }

[dev-dependencies]
stela-driver-base = { path = "../stela-driver-base", features = ["test-support"] }
sha2 = { version = "0.10", default-features = false }
